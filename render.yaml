# Déploiement Render (Blueprint) : site Next.js + base PostgreSQL.
# Sur Render : New > Blueprint, choisir ce dépôt, puis renseigner ADMIN_EMAIL et ADMIN_PASSWORD.
services:
  - type: web
    name: adecap-site
    runtime: node
    plan: free            # passer à "starter" pour éviter la mise en veille après 15 min d’inactivité
    region: frankfurt     # la région la plus proche de Dakar
    buildCommand: npm run render:build
    startCommand: npm run render:start   # applique les migrations et les données initiales, puis démarre
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: adecap-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur ADECAP
      - key: SITE_URL
        sync: false

databases:
  - name: adecap-db
    databaseName: adecap
    user: adecap
    plan: free            # gratuit 30 jours : passer à "basic-256mb" avant expiration pour garder les données
    region: frankfurt
